<html lang="en" class="scroll-smooth">
<head>

          borderRadius: { "DEFAULT": "0.25rem","lg": "0.5rem","xl": "0.75rem","full": "9999px" },

  <style>
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    .material-symbols-outlined.fill { font-variation-settings: 'FILL' 1; }
    .shadow-ambient { box-shadow: 0 1px 3px rgba(15,23,42,0.08), 0 10px 15px -3px rgba(15,23,42,0.05); }
    .shadow-elevated { box-shadow: 0 4px 6px -1px rgba(15,23,42,0.08), 0 20px 25px -5px rgba(15,23,42,0.05); }
    .ambient-shadow { box-shadow: 0 4px 20px -2px rgba(15,23,42,0.05), 0 1px 3px rgba(15,23,42,0.08); }
    .glass-panel { background: rgba(255,255,255,0.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.5); }
    .glass-card { background: rgba(255,255,255,0.9); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.5); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -1px rgba(0,0,0,0.03); }
    @keyframes marquee { 0% { transform: translateX(0%); } 100% { transform: translateX(-100%); } }
    .animate-marquee { animation: marquee 30s linear infinite; }
    @keyframes carousel { 0%,20% { opacity:1; z-index:10; } 25%,100% { opacity:0; z-index:0; } }
    .carousel-item { position:absolute; inset:0; opacity:0; animation: carousel 20s infinite; }
    .carousel-item:nth-child(1){animation-delay:0s} .carousel-item:nth-child(2){animation-delay:5s} .carousel-item:nth-child(3){animation-delay:10s} .carousel-item:nth-child(4){animation-delay:15s}
    .bento-grid { display:grid; grid-template-columns: repeat(12,1fr); gap:24px; }
    .timeline-line::before { content:''; position:absolute; left:15px; top:24px; bottom:-24px; width:2px; background:#c6c6cd; z-index:0; }
    .timeline-item:last-child .timeline-line::before { display:none; }
    *{ scrollbar-width: thin; scrollbar-color:#c6c6cd transparent; }
  </style>
</head>
<body class="bg-background text-on-background font-body-md antialiased overflow-x-hidden">
  <div id="root"></div>
