                "on-error": "#ffffff",

                "secondary-fixed-dim": "#fcd34d",

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-surface-container-lowest min-h-screen font-body-md text-on-surface antialiased">
<header class="flex items-center justify-between px-xl py-lg border-b border-outline-variant bg-surface-container-lowest">
<div class="flex items-center gap-md">
<img alt="EARMS Logo" class="h-10 w-auto object-contain" src="assets/stitch_login/logo.png"/>
<span class="font-headline-sm text-headline-sm text-on-surface">EARMS</span>
</div>
<button id="logout-btn" class="flex items-center gap-sm font-label-md text-label-md text-primary hover:text-primary-fixed-dim transition-colors">
<span class="material-symbols-outlined text-[18px]">logout</span> Log out
</button>
</header>

<main class="max-w-4xl mx-auto px-xl py-xxl">
<h1 class="font-headline-lg text-headline-lg text-on-surface mb-md">Welcome to your research portal</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant mb-xl">You are signed in. The full dashboard will be built next.</p>

<div id="entitlements" class="grid grid-cols-1 md:grid-cols-3 gap-md">
<div class="p-lg rounded-xl bg-surface-container border border-outline-variant">
<span class="material-symbols-outlined text-primary text-[28px]">verified_user</span>
<p class="font-label-md text-label-md text-on-surface mt-sm">Authenticated</p>
<p class="font-body-sm text-body-sm text-on-surface-variant">Access token is valid.</p>
</div>
</div>

<div id="entitlement-detail" class="mt-xl p-lg rounded-xl bg-surface-container-low border border-outline-variant hidden">
<p class="font-label-md text-label-md text-on-surface mb-sm">Subscription &amp; Features</p>
<pre id="entitlement-json" class="font-body-sm text-body-sm text-on-surface-variant whitespace-pre-wrap"></pre>
</div>
</main>

<div id="error-banner" class="fixed top-md left-1/2 -translate-x-1/2 hidden w-max max-w-[90%] rounded-lg bg-error-container text-on-error-container text-body-sm font-body-sm px-md py-sm"></div>

<script src="assets/earms-auth.js"></script>
<script>
  (function () {
    var E = window.EARMS;
    var errorBanner = document.getElementById("error-banner");

    function showError(msg) {
      errorBanner.textContent = msg;
      errorBanner.classList.remove("hidden");
    }

    document.getElementById("logout-btn").addEventListener("click", async function () {
      try {
        await E.authApi.logout();
      } catch (e) { /* clear happens in logout() */ }
      window.location.href = "index.html";
    });

    async function init() {
      if (!E.tokenService.isAuthenticated()) {
        window.location.href = "index.html";
        return;
      }
      try {
        var data = await E.authApi.getEntitlements();
        var detail = document.getElementById("entitlement-detail");
        document.getElementById("entitlement-json").textContent = JSON.stringify(data, null, 2);
        detail.classList.remove("hidden");
      } catch (err) {
        // 401 path is handled inside apiFetch (refresh or redirect to login).
        if (!E.tokenService.isAuthenticated()) {
          window.location.href = "index.html";
        } else {
          showError("Could not load entitlements: " + (err.message || "unknown error"));
        }
      }
    }

    init();
  })();
</script>
</body></html>
