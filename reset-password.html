<style>
        .material-symbols-outlined {

<body class="bg-surface-container-lowest min-h-screen font-body-md text-on-surface antialiased flex flex-col items-center justify-center p-lg md:p-xl">
<div class="w-full max-w-sm">
<div class="flex flex-col items-center mb-xl">
<img alt="EARMS Logo" class="h-20 w-auto object-contain mb-md" src="assets/stitch_login/logo.png"/>
<h1 class="font-headline-md text-headline-md text-on-surface text-center">Reset Password</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-sm text-center">Choose a new password for your account.</p>
</div>

<div class="w-full rounded-lg bg-surface-container text-on-surface text-body-sm font-body-sm px-md py-sm mb-md hidden" id="info-message"></div>
<div class="w-full rounded-lg bg-error-container text-on-error-container text-body-sm font-body-sm px-md py-sm mb-md hidden" id="auth-message" role="alert"></div>

<form id="newpw-form" class="space-y-lg" method="POST" novalidate>
<input type="hidden" id="token" name="token"/>
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface block" for="email">Email</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-outline">mail</span>
<input class="w-full pl-xl pr-md py-[12px] bg-surface-bright border border-outline-variant rounded-lg focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors text-body-md font-body-md placeholder-outline-variant" id="email" name="email" placeholder="researcher@institution.edu" required="" type="email"/>
</div>
</div>
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface block" for="newPassword">New Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-outline">lock</span>
<input class="w-full pl-xl pr-xl py-[12px] bg-surface-bright border border-outline-variant rounded-lg focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors text-body-md font-body-md" id="newPassword" name="newPassword" placeholder="••••••••" required="" type="password"/>
<button id="toggle-new" class="absolute right-sm top-1/2 -translate-y-1/2 text-outline hover:text-on-surface transition-colors focus:outline-none" type="button" aria-label="Show password">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface block" for="confirmPassword">Confirm Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-outline">lock</span>
<input class="w-full pl-xl pr-xl py-[12px] bg-surface-bright border border-outline-variant rounded-lg focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors text-body-md font-body-md" id="confirmPassword" name="confirmPassword" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<button class="w-full bg-primary text-on-primary font-label-md text-label-md py-[14px] rounded-lg hover:bg-primary-fixed-dim transition-colors duration-200 flex justify-center items-center gap-sm shadow-sm" type="submit">
                Update Password
                <span class="material-symbols-outlined text-[18px]">check</span>
</button>
</form>

<div class="mt-lg text-center">
<a class="font-label-md text-label-md text-primary hover:text-primary-fixed-dim transition-colors" href="index.html">&larr; Back to Login</a>
</div>
</div>
<script src="assets/earms-auth.js"></script>
<script>
  (function () {
    var params = new URLSearchParams(window.location.search);
    var token = params.get("token") || "";
    var email = params.get("email") || "";
    document.getElementById("token").value = token;
    if (email) document.getElementById("email").value = email;

    var form = document.getElementById("newpw-form");
    var message = document.getElementById("auth-message");
    var info = document.getElementById("info-message");
    var submitBtn = form.querySelector('button[type="submit"]');

    function showError(msg) { message.textContent = msg; message.classList.remove("hidden"); }
    function showInfo(msg) { info.textContent = msg; info.classList.remove("hidden"); }
    function clear() { message.classList.add("hidden"); info.classList.add("hidden"); }

    document.getElementById("toggle-new").addEventListener("click", function () {
      var inp = document.getElementById("newPassword");
      var isPw = inp.type === "password";
      inp.type = isPw ? "text" : "password";
      this.querySelector(".material-symbols-outlined").textContent = isPw ? "visibility_off" : "visibility";
    });

    if (!token) {
      showError("Missing or invalid reset token. Please request a new reset link.");
      submitBtn.disabled = true;
    }

    form.addEventListener("submit", async function (e) {
      e.preventDefault();
      clear();
      var emailVal = document.getElementById("email").value.trim();
      var newPassword = document.getElementById("newPassword").value;
      var confirm = document.getElementById("confirmPassword").value;
      if (!token) { showError("Missing reset token."); return; }
      if (!emailVal || !newPassword) { showError("Please complete all fields."); return; }
      if (newPassword !== confirm) { showError("Passwords do not match."); return; }
      submitBtn.disabled = true;
      try {
        await window.EARMS.authApi.resetPassword(emailVal, token, newPassword);
        // Redirect to login after successful reset (Section 4.2 / 15).
        window.location.href = "index.html?reset=success";
      } catch (err) {
        showError(err.message || "Password reset failed. Please try again.");
        submitBtn.disabled = false;
      }
    });
  })();
</script>
</body></html>
