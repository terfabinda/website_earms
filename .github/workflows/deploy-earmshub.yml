name: Deploy earmshub.com

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-earmshub
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Include Apache config and cPanel deploy file
        run: |
          cp deploy-earmshub/.htaccess dist/.htaccess
          cp deploy-earmshub/.cpanel.yml dist/.cpanel.yml

      - name: Publish site to deploy branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: deploy
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: "deploy: ${{ github.sha }}"
